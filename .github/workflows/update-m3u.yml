name: Update YouTube M3U

on:
  schedule:
    - cron: '0 */6 * * *'  # Her 6 saatte bir
  workflow_dispatch:         # ✅ MANUEL ÇALIŞTIRMA AKTİF

jobs:
  update-m3u:
    runs-on: ubuntu-latest
    
    steps:
    - name: Repository'yi indir
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Tüm commit geçmişini al
        token: ${{ secrets.GITHUB_TOKEN }}
      
    - name: Python kurulumu
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Gerekli kütüphaneleri yükle
      run: |
        pip install requests
        pip install --upgrade pip
        
    - name: Başlangıç beklemesi (Rate Limiting önlemi)
      run: |
        echo "⏳ GitHub Actions ortamında başlangıç beklemesi..."
        sleep 15
        
    - name: YouTube M3U scriptini çalıştır
      run: |
        echo "🚀 Python scripti çalıştırılıyor..."
        python youtube_m3u_generator.py
        
        # M3U dosyasının oluşup oluşmadığını kontrol et
        if [ -f "youtube.m3u" ]; then
          echo "✅ youtube.m3u dosyası oluşturuldu"
          echo "📊 Dosya boyutu: $(wc -l < youtube.m3u) satır"
        else
          echo "❌ youtube.m3u dosyası oluşturulamadı!"
          exit 1
        fi
      
    - name: Değişiklikleri kaydet ve gönder
      run: |
        git config --global user.email "action@github.com"
        git config --global user.name "GitHub Action"
        
        # Değişiklikleri kontrol et
        if git diff --quiet youtube.m3u; then
          echo "ℹ️  Değişiklik yok, commit atlanıyor."
        else
          echo "📝 Değişiklikler tespit edildi, commit oluşturuluyor..."
          
          # M3U dosyasındaki kanal sayısını al
          CHANNEL_COUNT=$(grep -c '^#EXTINF:' youtube.m3u || echo "0")
          CURRENT_DATE=$(date +'%Y-%m-%d %H:%M')
          
          git add youtube.m3u
          git commit -m "YouTube M3U güncellendi - $CURRENT_DATE ($CHANNEL_COUNT kanal)"
          
          echo "🚀 Değişiklikler push ediliyor..."
          git push
          echo "✅ Değişiklikler başarıyla push edildi."
        fi
        
    - name: İşlem tamamlandı
      run: |
        echo "🎉 GitHub Actions işlemi başarıyla tamamlandı!"
        echo "⏰ Bir sonraki çalışma: 6 saat sonra"
